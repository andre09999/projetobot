services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend/src:/app/src

  backend:
    build:
      context: ./backend
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      MYSQL_ADDON_HOST: database
      MYSQL_ADDON_DB: ${MYSQL_ADDON_DB:-BotTelegram}
      MYSQL_ADDON_USER: ${MYSQL_ADDON_USER:-root}
      MYSQL_ADDON_PORT: 3306
      MYSQL_ADDON_PASSWORD: ${MYSQL_ADDON_PASSWORD}
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0.29
    container_name: telegram-bot-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_ADDON_DB:-BotTelegram}
    ports:
      - "${MYSQL_EXPOSED_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
